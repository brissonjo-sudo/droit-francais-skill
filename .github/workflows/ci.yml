name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le SDK MCP
        run: python -m pip install -r requirements-mcp.txt

      - name: Compiler les scripts Python (py_compile)
        run: |
          python -m py_compile skill/scripts/legifrance.py
          python -m py_compile skill/scripts/droit_francais/__init__.py
          python -m py_compile skill/scripts/droit_francais/errors.py
          python -m py_compile skill/scripts/droit_francais/config.py
          python -m py_compile skill/scripts/droit_francais/transport.py
          python -m py_compile skill/scripts/droit_francais/legifrance.py
          python -m py_compile skill/scripts/droit_francais/judilibre.py
          python -m py_compile skill/scripts/droit_francais/tools.py
          python -m py_compile mcp_server/server.py
          python -m py_compile tests/run_eval.py
          python -m py_compile tests/check_links.py
          python -m py_compile tests/check_commands.py
          python -m py_compile tests/check_plugin.py
          python -m py_compile tests/test_tools.py
          python -m py_compile tests/test_mcp_app.py

      - name: Tester la bibliothèque et le serveur MCP hors réseau
        run: python -m unittest discover -s tests -v

      - name: Vérifier le socle du plugin
        run: python tests/check_plugin.py

      - name: Vérifier les liens Markdown
        run: python tests/check_links.py

      - name: Vérifier la cohérence doc ↔ CLI (sous-commandes)
        run: python tests/check_commands.py

      - name: Éval hors-ligne (check-list 14 modes)
        run: python tests/run_eval.py
