name: Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Workflow et script figés au même commit de ci-tooling : une modification
    # de ci-tooling ne s'applique ici qu'après mise à jour explicite des deux SHA.
    uses: brissonjo-sudo/ci-tooling/.github/workflows/auto-review.yml@9aea2535b175be30203c39ce03b67f781f63638e
    # Un workflow appele ne peut pas elargir les droits de l appelant : c est
    # ici qu ils sont accordes, et le workflow central ne fait que les reduire.
    permissions:
      contents: read
      pull-requests: write
    # Seules les deux clés de relecture sont transmises, jamais les autres secrets.
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    with:
      tooling-ref: 9aea2535b175be30203c39ce03b67f781f63638e
