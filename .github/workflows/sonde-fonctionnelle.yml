name: Sonde fonctionnelle

# Appelle réellement les six outils du service déployé, avec un vrai jeton
# OAuth, et exige de chaque réponse sa provenance officielle et sa datation
# explicite — dont applicable_at_as_of_date à la lecture d'un article.
# Lecture : docs/exploitation.md, § « Sonde fonctionnelle ».
#
# Déclenchement manuel uniquement, et c'est délibéré. Contrairement à
# « Surveillance », cette sonde consomme le quota PISTE du titulaire des clés à
# chaque exécution : la planifier reviendrait à dépenser un quota partagé sans
# qu'aucune décision n'en dépende. Elle se lance après un déploiement, après un
# incident, ou avant une soumission.
#
# Le jeton vit dans le secret de dépôt MCP_ACCESS_TOKEN et n'est jamais rendu
# en argument de ligne de commande — il apparaîtrait dans la liste des
# processus du runner. La sonde le lit dans l'environnement et ne l'affiche
# jamais ; elle masque aussi le détail technique des erreurs de transport, qui
# peut porter des en-têtes.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL complète du endpoint MCP à sonder"
        required: false
        default: "https://droit-francais-skill.onrender.com/mcp"

permissions:
  contents: read

# Deux exécutions simultanées consommeraient le quota en parallèle et
# pourraient se déclencher mutuellement une limite de débit qui serait lue à
# tort comme un défaut du service.
concurrency:
  group: sonde-fonctionnelle
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    # La sonde enchaîne six appels réels vers deux API amont, dont des
    # reprises bornées sur erreur transitoire, et peut tomber sur un réveil
    # d'instance Render de plus de trente secondes avant le premier appel.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Installer le SDK MCP
        run: python -m pip install -r requirements-mcp.txt

      # Sans ce garde, un secret absent produirait l'échec de la sonde
      # elle-même — message exact mais noyé après une installation complète.
      # Le contrôle porte sur la présence, jamais sur la valeur.
      - name: Vérifier que le jeton est configuré
        env:
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: |
          if [ -z "$MCP_ACCESS_TOKEN" ]; then
            echo "::error::le secret de dépôt MCP_ACCESS_TOKEN est absent ou vide."
            echo "Le renseigner dans Settings → Secrets and variables → Actions."
            echo "Obtention du jeton : docs/validation-chatgpt.md."
            exit 1
          fi
          echo "Jeton présent ; sa valeur n'est ni affichée ni journalisée."

      - name: Sonder les six outils
        env:
          # Le jeton passe par l'environnement, jamais en argument : la ligne
          # de commande est visible dans la liste des processus du runner.
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
        run: python tests/check_live_tools.py "${{ inputs.url }}"
