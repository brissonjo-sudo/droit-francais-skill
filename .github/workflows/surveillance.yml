name: Surveillance

# Sonde le service déployé sans jeton et sans quota, et consigne chaque mesure
# sur la branche « surveillance ». Un seul rôle : tenir le registre de la
# période d'observation avant publication — la série de mesures, pas une mesure
# isolée, dit si le service tient sans défaut ni dérive de latence.
# Lecture : docs/exploitation.md, § « Surveillance automatique ».
#
# Ce workflow a d'abord porté un second rôle, maintenir l'instance Render
# gratuite hors veille, et il en a été retiré le 2 septembre 2026 : la mesure
# l'a réfuté. GitHub n'exécute les workflows planifiés qu'en « meilleur
# effort » et en supprime sous charge — quatre runs pour environ
# soixante-dix-huit attendus en treize heures avec « */10 », un seul après le
# resserrement à « 3/5 ». Toutes les exécutions planifiées sont tombées sur une
# instance endormie (réveils de 32,4 à 32,7 s). Le maintien hors veille est
# donc confié à un service de ping externe : docs/pieces-humaines.md § 11.
#
# Le cron est en conséquence ramené à une exécution horaire, qui correspond à
# ce que le planificateur peut réellement rendre pour ce seul registre.
#
# La branche « surveillance » est orpheline et hors protection : elle ne porte
# que le journal. Le jeton par défaut suffit à y pousser, et un push de ce
# jeton ne déclenche aucun autre workflow.

on:
  schedule:
    # Éviter le début d'heure, explicitement signalé comme période chargée par
    # GitHub : https://docs.github.com/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Une seule exécution à la fois : deux runs qui pousseraient en même temps sur
# la branche du journal se rejetteraient mutuellement.
concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    # La sonde attend au pire 2 × 90 s sur /health, plus environ quatre
    # requêtes à 15 s pour les métadonnées : près de quatre minutes d'attente
    # réseau sur un service joignable mais très dégradé, auxquelles s'ajoutent
    # les deux checkout et l'installation de Python. Un job annulé pour
    # dépassement ne consigne rien — il perdrait justement la mesure d'une
    # dégradation réelle. Le budget est donc pris large.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Récupérer le journal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: surveillance
          path: journal

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # La sonde rend un code non nul sur défaut ; on le conserve pour la fin
      # du job, après avoir consigné la mesure : un défaut non journalisé
      # serait invisible dans la série.
      - name: Sonder le service
        id: sonde
        run: |
          horodatage=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          set +e
          python tests/check_service_health.py --json --horodatage "$horodatage" > mesure.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # La sonde ne doit plus jamais rendre une sortie vide : depuis
          # qu'elle intercepte les pannes de connexion, une indisponibilité
          # produit une mesure au lieu d'une trace de pile. Le cas est tout de
          # même signalé, parce qu'il ferait disparaître un incident de la
          # série sans que rien ne le dise.
          if [ -s mesure.json ]; then
            echo "vide=false" >> "$GITHUB_OUTPUT"
          else
            echo "vide=true" >> "$GITHUB_OUTPUT"
            echo "::error::la sonde n'a produit aucune mesure"
          fi
          cat mesure.json

      # Journaliser d'abord, juger ensuite : cette étape ne doit pas être ce
      # qui fait échouer le job, sans quoi le résumé de série ne serait jamais
      # publié et l'échec ne porterait pas son message explicite.
      - name: Consigner la mesure
        if: steps.sonde.outputs.vide != 'true'
        run: |
          cat mesure.json >> journal/surveillance.jsonl
          cd journal
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add surveillance.jsonl
          # « git commit » sort en 1 quand rien n'est indexé : sans ce garde,
          # une mesure vide arrêtait le job ici même.
          if git diff --cached --quiet; then
            echo "rien à consigner : le journal est inchangé"
          else
            git commit --quiet -m "mesure $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Un run précédent a pu pousser entre notre checkout et maintenant.
            git pull --rebase --quiet origin surveillance
            git push --quiet origin HEAD:surveillance
          fi

      - name: Résumer la série
        if: always()
        run: python tests/summarize_surveillance.py journal/surveillance.jsonl --jours 7 >> "$GITHUB_STEP_SUMMARY"

      - name: Signaler le défaut
        if: always() && (steps.sonde.outputs.code != '0' || steps.sonde.outputs.vide == 'true')
        run: |
          if [ "${{ steps.sonde.outputs.vide }}" = "true" ]; then
            echo "La sonde n'a produit aucune mesure : incident non journalisé."
          else
            echo "La sonde a relevé un défaut (voir la mesure ci-dessus)."
          fi
          exit 1
